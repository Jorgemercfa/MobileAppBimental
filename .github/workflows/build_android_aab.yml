name: Build Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      # 👇 Muy importante: ir a la carpeta del proyecto Flutter
      - name: Go to Flutter project directory
        run: cd bimental_application_1

      # 👇 El resto de comandos ya corren dentro del directorio
      - name: Flutter pub get
        run: |
          cd bimental_application_1
          flutter pub get

      - name: Build AAB
        run: |
          cd bimental_application_1
          flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: bimental_application_1/build/app/outputs/bundle/release/app-release.aab
